<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090d">
<title>Nexus — Kararların Gücü</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#08090d;--card:#12151e;--border:#242938;--purple:#7c5cff;--text:#f8fafc;--muted:#8d96aa;--gradient:linear-gradient(135deg,#6d5dfc,#a855f7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#050609;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
body{min-height:100vh}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.app{width:100%;max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.login-box{width:100%;text-align:center}
.logo{width:82px;height:82px;border-radius:26px;margin:0 auto 22px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;box-shadow:0 20px 60px #7c5cff4d}
.logo-title{font-size:42px;font-weight:800;letter-spacing:-2px;margin-bottom:8px}
.logo-sub{color:var(--muted);line-height:1.6;margin-bottom:35px}
.input{width:100%;padding:15px 16px;background:var(--card);border:1px solid var(--border);border-radius:15px;color:white;outline:0;font-size:14px;margin-bottom:10px}
.primary{width:100%;border:0;border-radius:16px;padding:16px;color:white;font-weight:800;font-size:15px;background:var(--gradient);box-shadow:0 12px 30px #7c5cff40}
#mainApp{display:none;min-height:100vh;padding-bottom:92px}
.screen{display:none;padding:20px 16px}
.screen.active{display:block}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:24px;margin:0}
.header p{margin:5px 0 0;color:var(--muted);font-size:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:800}
.decision{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:17px;margin-bottom:15px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:76px;background:#0a0c11f2;backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:50}
.nav{border:0;background:none;color:#697386;font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px}
.nav.active{color:#9a8cff}
.nav-create{width:48px;height:48px;border-radius:16px;border:0;background:var(--gradient);color:white;font-size:25px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#252a37;border:1px solid #3b4252;color:white;padding:11px 16px;border-radius:13px;font-size:11px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:35px 10px;color:#687286;font-size:12px}
</style>
</head>
<body>

<div class="app">
<section id="login">
<div class="login-box">
<div class="logo">N</div>
<div class="logo-title">Nexus</div>
<div class="logo-sub">Kararını topluluğa bırak.<br>Sonucunu geri getir.</div>
<input id="username" class="input" maxlength="20" placeholder="Kullanıcı adın...">
<button class="primary" onclick="login()">Nexus'a Gir →</button>
</div>
</section>

<main id="mainApp">
<section id="home" class="screen active">
<div class="header">
<div>
<h1>🔥 Nexus</h1>
<p>Topluluk havuzu</p>
</div>
<div class="avatar" id="headerAvatar">N</div>
</div>
<div class="decision">
<div class="empty">Hoş geldin! Nexus şu an aktif ve hazır. 🚀</div>
</div>
</section>

<nav class="bottom-nav">
<button class="nav active" onclick="showScreen('home',this)">🔥<span>Havuz</span></button>
<button class="nav-create" onclick="showScreen('home',this)">+</button>
<button class="nav" onclick="showScreen('home',this)">👤<span>Profil</span></button>
</nav>
</main>

<div id="toast" class="toast"></div>
</div>

<script>
const SUPABASE_URL = "https://fulzvcfjmbtjljlowoso.supabase.co";
const SUPABASE_KEY = "sb_publishable_nboUtwCIJFUE3Zp2rmfcWw_nvLXQqRL";

let supabaseClient = null;
try {
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) {
  console.error(e);
}

window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("nexus_user");
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      startApp();
    } catch(e) {}
  }
});

let currentUser = null;

async function login() {
  const val = document.getElementById("username").value.trim();
  if (!val) {
    showToast("Kullanıcı adını gir");
    return;
  }

  currentUser = {
    id: localStorage.getItem("nexus_user_id") || crypto.randomUUID(),
    username: "@" + val.replace(/\s+/g, "").substring(0, 20)
  };

  localStorage.setItem("nexus_user_id", currentUser.id);
  localStorage.setItem("nexus_user", JSON.stringify(currentUser));

  if (supabaseClient) {
    try {
      await supabaseClient.from("profiles").upsert({
        id: currentUser.id,
        username: currentUser.username
      }, { onConflict: "id" });
    } catch (err) {
      console.log("Supabase yazma atlandı:", err);
    }
  }

  startApp();
  showToast("Nexus'a hoş geldin 🚀");
}

function startApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  if (currentUser) {
    document.getElementById("headerAvatar").innerText = currentUser.username.replace("@","")[0].toUpperCase();
  }
}

function showScreen(id, btn) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav").forEach(n => n.classList.remove("active"));
  if (btn && btn.classList.contains("nav")) btn.classList.add("active");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
